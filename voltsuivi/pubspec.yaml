name: voltsuivi
description: "VoltSuivi — carnet de suivi des recharges pour voiture électrique."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI
  fl_chart: ^0.70.2
  intl: ^0.20.2
  shared_preferences: ^2.3.4

  # Export
  csv: ^6.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F2F4F7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#F2F4F7"
  color_dark: "#111B2B"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#F2F4F7"
    color_dark: "#111B2B"
    image: "assets/icon/splash_logo.png"
